[build]
  command = "npm run prepare:netlify"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

[functions]
  node_bundler = "esbuild"
  # REQUIRED: EJS reads templates from disk at runtime, and the data/lib files
  # are require()d dynamically at various depths. Without this every page fails
  # with `Failed to lookup view "index"` or `Cannot find module`.
  included_files = ["views/**", "data/**", "lib/**", "img/**", "public/**"]

# No `force = true` — files in the publish directory must win over the function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

# ---------------------------------------------------------------- caching
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ------------------------------------------------------------ security
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
